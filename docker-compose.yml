# =============================================================================
# keycloak-local — entorno local de Keycloak 26.x + PostgreSQL 16
#
# Uso:
#   docker compose up -d          # levanta el entorno e importa el realm
#   docker compose down -v        # resetea todo (borra volúmenes)
#   docker compose logs -f        # ver logs
#
# La importación del realm se hace en el primer arranque leyendo los
# archivos *.json de /opt/keycloak/data/import (montado desde ./realm).
# El archivo debe llamarse <realm>-realm.json  ->  ecommerce-realm.json
# =============================================================================

name: keycloak-local

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — base de datos de Keycloak
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: keycloak-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      # Solo localhost: no exponer Postgres a la red externa
      - "127.0.0.1:5432:5432"
    volumes:
      # Volumen con nombre: la BD persiste entre reinicios
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Keycloak 26.x
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak-local-keycloak
    restart: unless-stopped
    # start-dev  -> modo desarrollo (HTTP directo, sin TLS)
    # --import-realm -> importa realm/ecommerce-realm.json al arrancar.
    #   Nota: si el realm ya existe, la importación se OMITE (no pisa estado).
    command: ["start-dev", "--import-realm"]
    environment:
      # Usuario administrador del realm "master" (consola: http://localhost:8080/admin)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Conexión a PostgreSQL (el host "postgres" resuelve en la red interna)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Health checks (opción build-time; por defecto está deshabilitada en 26.x)
      KC_HEALTH_ENABLED: "true"
      # Exponer /health* en el puerto principal (8080) en vez del puerto de gestión (9000)
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Directorio de importación: cualquier *.json aquí se importa al arrancar
      - ./realm:/opt/keycloak/data/import:ro
    networks:
      - keycloak-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # La imagen 26.x NO incluye curl/wget (eliminados por seguridad). Se usa
      # bash + /dev/tcp (patrón recomendado por la documentación oficial).
      test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

# Volúmenes persistentes con nombre
volumes:
  postgres_data:

# Red interna para la comunicación entre servicios
networks:
  keycloak-network:
    driver: bridge
